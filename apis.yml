aid: ping
name: Ping++
description: >-
  Ping++ (品牌运营方为上海简米网络科技有限公司 / Shanghai Jianmi Network Technology Co., Ltd.) is a
  Chinese aggregated-payment ("聚合支付") platform that gives merchants a single REST API and
  multi-platform SDKs to accept payments across WeChat Pay, Alipay, UnionPay, bank cards and
  other channels, plus compliant profit-sharing / split-settlement (分账), enterprise payouts
  (企业付款 / Transfers), red envelopes, member account systems and multi-tier merchant systems.
  The Stripe-inspired API is REST, JSON, HTTP Basic authenticated with an API Key, and organised
  around Charge, Refund, Transfer, Order, User, Recharge, Withdrawal, Coupon and Royalty objects,
  with cursor pagination, metadata, webhooks and a dated changelog. This profile was seeded as a
  venture-portfolio lead (General Catalyst, Ribbit Capital) and enriched from Ping++'s public
  developer surface.
